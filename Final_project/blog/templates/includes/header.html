{% load static %}

<header class="fixed top-0 left-0 w-full bg-white shadow-sm z-50 px-4 sm:px-6 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <!-- Logo和品牌 -->
        <a class="flex items-center gap-2 shrink-0" href="/">
            <img class="h-7" src="{% static 'images/cheese.png' %}" alt="Logo" />
            <span class="text-xl font-bold text-pink-500">CheeseO</span>
        </a>

        <!-- 中间导航 -->
        <nav class="hidden md:block mx-4">
            <ul class="flex items-center gap-6">
                <li><a href="/" class="text-gray-600 hover:text-pink-500 font-medium transition-colors">首页</a></li>
               <li><a href="/blog" class="text-gray-600 hover:text-pink-500 font-medium transition-colors">博文</a></li>
                <!-- 帮助按钮 -->
                <li><a href="{% url 'a_home:help' %}" class="text-gray-600 hover:text-pink-500 font-medium transition-colors">帮助</a></li>
                <!-- 关于我们按钮 -->
                <li><a href="{% url 'a_home:find' %}" class="text-gray-600 hover:text-pink-500 font-medium transition-colors">关于我们</a></li>
                <!-- 主推产品按钮 -->
                <li><a href="{% url 'a_home:about' %}" class="text-gray-600 hover:text-pink-500 font-medium transition-colors">主推产品</a></li>
                
            </ul>
        </nav>

    <!-- 右侧操作区 -->
    <div class="flex items-center gap-3 sm:gap-4">
        {% if request.user.is_authenticated %}
            <!-- 每日签到按钮（移动端和桌面端） -->
            <button id="check-in-trigger" class="bg-pink-500 text-white px-3 py-1.5 rounded-full text-sm font-medium hover:bg-pink-600 transition-colors whitespace-nowrap">
                每日签到
            </button>

    <!-- 个人资料下拉菜单 -->
    <div x-data="{ dropdownOpen: false }" class="relative">
        <button @click="dropdownOpen = !dropdownOpen" @click.away="dropdownOpen = false" 
                class="flex items-center gap-2 cursor-pointer bg-pink-500 text-white px-3 py-1.5 rounded-full text-sm font-medium hover:bg-pink-600 transition-colors whitespace-nowrap">
            <img class="h-5 w-5 rounded-full object-cover" src="{{ request.user.profile.avatar }}" alt="Avatar" />
            <span class="hidden sm:inline">{{ request.user.profile.name }}</span>
        </button>
        <div x-show="dropdownOpen" x-cloak class="absolute right-0 bg-white text-gray-900 shadow-lg rounded-xl w-48 p-2 mt-2 z-20" 
             x-transition:enter="transition ease-out duration-100"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">
            <ul>
                <li><a href="{% url 'profile' %}" class="flex items-center gap-2 py-2 px-3 rounded text-sm hover:bg-gray-50 hover:text-pink-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>个人资料</a></li>
                <li><a href="{% url 'profile-edit' %}" class="flex items-center gap-2 py-2 px-3 rounded text-sm hover:bg-gray-50 hover:text-pink-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>编辑资料</a></li>
                <li><a href="{% url 'browsing-history' %}" class="flex items-center gap-2 py-2 px-3 rounded text-sm hover:bg-gray-50 hover:text-pink-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>浏览历史</a></li>
                <li class="border-t border-gray-100 mt-1 pt-1"><a href="{% url 'account_logout' %}" class="flex items-center gap-2 py-2 px-3 rounded text-sm text-gray-500 hover:bg-gray-50 hover:text-pink-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>退出登录</a></li>
            </ul>
        </div>
    </div>
{% else %}
    <a href="{% url 'account_login' %}" class="bg-pink-500 text-white px-4 py-1.5 rounded-full text-sm font-medium hover:bg-pink-600 transition-colors whitespace-nowrap">登录</a>
    <a href="{% url 'account_signup' %}?next={% url 'profile-onboarding' %}" class="text-gray-700 hover:text-pink-500 font-medium text-sm transition-colors">注册</a>
{% endif %}

        <!-- 移动端菜单按钮（仅在移动端显示） -->
    <div class="md:hidden relative">
        <button class="flex items-center bg-transparent text-gray-600 hover:text-gray-800" id="mobile-menu-button">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        
        <!-- 修改后的移动端菜单面板 -->
        <div id="mobile-menu" class="hidden absolute right-0 bg-white text-gray-900 shadow-lg rounded-xl w-48 p-2 mt-2 z-20">
            <ul class="space-y-2">
                <li><a href="/" class="block py-2 px-3 text-sm hover:bg-gray-50 hover:text-pink-500 rounded transition-colors">首页</a></li>
               <li><a href="/blog" class="block py-2 px-3 text-sm hover:bg-gray-50 hover:text-pink-500 rounded transition-colors">博文</a></li>
                <!-- 移动端帮助按钮 -->
                <li><a href="{% url 'a_home:help' %}" class="block py-2 px-3 text-sm hover:bg-gray-50 hover:text-pink-500 rounded transition-colors">帮助</a></li>
                <!-- 移动端关于我们按钮 -->
                 <li><a href="{% url 'a_home:find' %}" class="block py-2 px-3 text-sm hover:bg-gray-50 hover:text-pink-500 rounded transition-colors">关于我们</a></li>
                <li><a href="{% url 'a_home:about' %}" class="block py-2 px-3 text-sm hover:bg-gray-50 hover:text-pink-500 rounded transition-colors">主推产品</a></li>
            </ul>
        </div>
    </div>
</header>


<!-- 签到弹窗 -->
<div id="check-in-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-xl">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-900">每日签到</h2>
            <button id="close-modal" class="text-gray-900 text-2xl bg-transparent hover:text-pink-500">×</button>
        </div>
        <form id="daily-check-in-form" method="post" action="{% url 'a_points:daily_check_in' %}">
            {% csrf_token %}
            <p class="mb-4 text-gray-600 text-lg roboto font-normal">签到成功可获得 <span class="font-semibold text-gray-900">10 积分</span>！</p>
            <div id="check-in-message" class="mb-4 text-sm font-medium hidden"></div>
            <div class="flex justify-end gap-3">
                <button type="button" id="cancel-modal" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 transition-colors">取消</button>
                <button type="submit" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 transition-colors">立即签到</button>
            </div>
        </form>
    </div>
</div>

<!-- 脚本：处理签到弹窗和移动端菜单切换 -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    // 签到弹窗相关
    const modal = document.getElementById('check-in-modal');
    const trigger = document.getElementById('check-in-trigger');
    const closeBtn = document.getElementById('close-modal');
    const cancelBtn = document.getElementById('cancel-modal');
    const form = document.getElementById('daily-check-in-form');
    const messageDiv = document.getElementById('check-in-message');

    const toggleModal = (show) => {
        modal.classList.toggle('hidden', !show);
    };

    trigger?.addEventListener('click', () => toggleModal(true));
    closeBtn?.addEventListener('click', () => toggleModal(false));
    cancelBtn?.addEventListener('click', () => toggleModal(false));

    form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        messageDiv.classList.add('hidden');

        const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        const data = await response.json();

        messageDiv.classList.remove('hidden');
        if (response.ok) {
            messageDiv.classList.add('text-green-600');
            messageDiv.textContent = '签到成功！获得 10 积分';
            setTimeout(() => toggleModal(false), 2000);
        } else {
            messageDiv.classList.add('text-red-600');
            messageDiv.textContent = data.error;
        }
    });
    
    // 移动端菜单切换
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    
    mobileMenuButton?.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
    });
});
</script>
